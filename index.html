<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo - Google Task Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  <link rel="icon" href="https://www.gstatic.com/images/branding/productlogos/tasks_2026/v2/ico/tasks_2026_32dp.ico">
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- 구글 Tasks처럼 흰색 카드 하나에 모든 내용을 담음 -->
  <div class="flex flex-col max-w-md mx-auto mt-10 bg-white rounded-2xl shadow-lg min-h-[500px]">

    <!-- 헤더 -->
    <div class="flex items-center gap-3 px-6 py-5">
      <span class="w-8 h-8 shrink-0 rounded-full bg-[#228B22] text-white flex items-center justify-center">
        <span class="material-symbols-outlined block leading-none">task_alt</span>
      </span>
      <h1 class="text-xl font-bold">Todo</h1>
    </div>

    <!-- 빠른 추가: 제목 입력 후 Enter / 오른쪽 버튼을 누르면 세부 등록 팝업 -->
    <div class="flex items-center gap-3 px-7 py-2 border-b border-gray-200">
      <span class="material-symbols-outlined text-[#228B22]">add_task</span>
      <input id="main-input" type="text" placeholder="할 일 추가 (Enter로 바로 등록)"
        class="flex-1 py-2 text-sm outline-none">
      <button id="open-form-btn" title="상세 설정"
        class="material-symbols-outlined text-gray-500 hover:bg-green-50 hover:text-[#228B22] rounded-full p-1">edit_note</button>
    </div>

    <!-- 목록 -->
    <ul id="todo-list"></ul>
    <p id="empty-msg" class="text-center text-gray-500 text-sm py-16 hidden">등록된 할 일이 없습니다.</p>

    <!-- 전체 삭제 버튼 (목록이 비어 있으면 숨김) -->
    <div id="clear-area" class="flex justify-end mt-auto px-6 pt-4 pb-4">
      <button id="clear-btn"
        class="flex items-center gap-1 px-2 py-1 text-xs text-gray-500 border border-gray-300 rounded-full hover:bg-red-50 hover:text-red-400 hover:border-red-300">
        <span class="material-symbols-outlined text-base">delete</span>
        전체 삭제
      </button>
    </div>
  </div>

  <!-- 추가/수정 팝업 -->
  <div id="form-popup" class="popup hidden">
    <div class="bg-white rounded-3xl shadow-xl p-6 w-[28rem]">

      <!-- 닫기(취소) 버튼 -->
      <div class="flex justify-end">
        <button id="form-cancel-btn" class="material-symbols-outlined text-gray-500 hover:bg-gray-100 rounded-full p-1">close</button>
      </div>

      <!-- 제목 -->
      <div class="pl-8 mb-4">
        <input id="title-input" type="text" placeholder="할 일 추가"
          class="w-full text-xl py-2 border-b-2 border-gray-300 outline-none focus:border-[#228B22]">
        <p id="error-msg" class="text-red-500 text-sm h-5 mt-1"></p>
      </div>

      <!-- 날짜, 시간 -->
      <div class="flex items-center gap-4 mb-4">
        <span class="material-symbols-outlined text-base">event</span>
        <input id="date-input" type="date" required class="bg-gray-100 rounded px-3 py-2 text-sm invalid:text-gray-400">
        <input id="time-input" type="time" required class="bg-gray-100 rounded px-3 py-2 text-sm invalid:text-gray-400">
      </div>

      <!-- 세부 내용 -->
      <div class="flex items-start gap-4 mb-6">
        <span class="material-symbols-outlined text-base mt-2">notes</span>
        <textarea id="content-input" rows="4" placeholder="내용 추가"
          class="flex-1 bg-gray-100 rounded px-3 py-2 text-sm outline-none"></textarea>
      </div>

      <div class="flex justify-end">
        <button id="form-ok-btn" class="px-4 py-2 rounded-full bg-[#228B22] text-sm text-white">저장</button>
      </div>
    </div>
  </div>

  <!-- 상세 보기 팝업 -->
  <div id="detail-popup" class="popup hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-96">
      <h2 id="detail-title" class="text-xl mb-2"></h2>
      <p id="detail-date" class="text-sm text-gray-500 mb-4"></p>
      <p id="detail-content" class="text-sm text-gray-500 whitespace-pre-wrap mb-6"></p>
      <div class="flex justify-end">
        <button id="detail-close-btn" class="px-4 py-2 text-sm rounded-full bg-[#228B22] text-white">닫기</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 팝업 -->
  <div id="delete-popup" class="popup hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-80">
      <h2 id="delete-title" class="text-lg mb-2"></h2>
      <p class="text-sm text-gray-500 mb-4">이 할 일을 삭제할까요?</p>
      <div class="flex justify-end gap-2">
        <button id="delete-cancel-btn" class="px-4 py-2 rounded-full text-sm text-[#228B22] hover:bg-green-50">취소</button>
        <button id="delete-ok-btn" class="px-4 py-2 rounded-full text-sm bg-[#228B22] text-white">삭제</button>
      </div>
    </div>
  </div>

  <!-- 완료 체크할 때 잠깐 나타나는 따봉 -->
  <div id="thumb" class="hidden">👍</div>

  <script src="js/todo.js"></script>
</body>

</html>
